<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Emotion-Aware Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14131A;
    --surface: #1E1D26;
    --text: #EDEBF2;
    --muted: #8A8796;
    --line: #2C2A36;
    --accent: #8A8796; /* replaced dynamically per detected emotion */
    --accent-dim: rgba(138,135,150,0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px 28px;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .title {
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--muted);
    margin-bottom: 6px;
    text-align: center;
  }

  .title strong { color: var(--text); font-weight: 500; }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 0 8px;
  }

  .orb-hit {
    position: relative;
    width: 200px;
    height: 200px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .orb-hit:disabled { cursor: default; }

  .orb-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    transition: border-color 0.5s ease;
  }

  .orb-glow {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--accent) 0%, transparent 72%);
    opacity: 0.55;
    filter: blur(2px);
    transition: background 0.6s ease, opacity 0.5s ease;
    animation: breathe 4.2s ease-in-out infinite;
  }

  .orb-core {
    position: absolute;
    inset: 58px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--accent);
    transition: border-color 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .orb-icon { width: 28px; height: 28px; color: var(--text); }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.06); opacity: 0.7; }
  }

  .orb-hit.recording .orb-glow {
    animation: pulse-rec 1.1s ease-in-out infinite;
    opacity: 0.85;
  }
  @keyframes pulse-rec {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.16); }
  }

  .orb-hit.thinking .orb-glow {
    animation: spin-think 1.6s linear infinite;
  }
  @keyframes spin-think {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.04); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .orb-hit.speaking .orb-glow {
    animation: pulse-speak 0.6s ease-in-out infinite;
  }
  @keyframes pulse-speak {
    0%, 100% { transform: scale(1.02); }
    50% { transform: scale(1.14); }
  }

  .status {
    margin-top: 18px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
    text-align: center;
  }

  .log {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 8px;
  }

  .bubble {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
  }

  .bubble .you {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .bubble .you span.tag {
    color: var(--accent);
    font-weight: 500;
  }

  .bubble .reply {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px;
    font-style: italic;
    line-height: 1.5;
    color: var(--text);
  }

  .error {
    width: 100%;
    background: var(--surface);
    border: 1px solid #4A2A2A;
    color: #E2A2A2;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    margin-top: 8px;
  }

  .cfg {
    margin-top: auto;
    padding-top: 24px;
    width: 100%;
  }

  .cfg summary {
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    list-style: none;
  }
  .cfg summary::-webkit-details-marker { display: none; }

  .cfg input {
    width: 100%;
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Emotion-aware voice assistant<br><strong>press the orb, say something</strong></div>

    <div class="stage">
      <button class="orb-hit" id="orb" aria-label="Press to talk">
        <div class="orb-ring"></div>
        <div class="orb-glow"></div>
        <div class="orb-core">
          <svg class="orb-icon" id="orbIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
            <path d="M19 11a7 7 0 0 1-14 0"/>
            <path d="M12 18v3"/>
          </svg>
        </div>
      </button>
    </div>

    <div class="status" id="status">Tap to talk</div>

    <div class="log" id="log"></div>

    <details class="cfg">
      <summary>Server settings</summary>
      <input id="baseUrl" placeholder="Leave blank to use this page's own server" spellcheck="false">
    </details>
  </div>

<script>
const EMOTION_COLORS = {
  neutral:   '#8A8796',
  happy:     '#F2B705',
  sad:       '#5C7AEA',
  angry:     '#E2513F',
  fearful:   '#8B5CF6',
  disgust:   '#7C9A3B',
  surprised: '#22B8CF',
};

const orb = document.getElementById('orb');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const baseUrlInput = document.getElementById('baseUrl');

let mediaRecorder = null;
let chunks = [];
let state = 'idle'; // idle | recording | thinking | speaking

function setState(next) {
  state = next;
  orb.classList.remove('recording', 'thinking', 'speaking');
  if (next !== 'idle') orb.classList.add(next);
  orb.disabled = (next === 'thinking' || next === 'speaking');
}

function setAccent(emotion) {
  const color = EMOTION_COLORS[emotion] || EMOTION_COLORS.neutral;
  document.documentElement.style.setProperty('--accent', color);
}

function setStatus(text) { statusEl.textContent = text; }

function apiUrl(path) {
  const base = baseUrlInput.value.trim().replace(/\/+$/, '');
  return base ? base + path : path;
}

function addBubble(transcript, emotion, reply) {
  const div = document.createElement('div');
  div.className = 'bubble';
  div.innerHTML = `
    <div class="you">You said <span class="tag">(${emotion})</span> &mdash; "${transcript}"</div>
    <div class="reply">${reply}</div>
  `;
  logEl.prepend(div);
}

function addError(message) {
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = message;
  logEl.prepend(div);
}

function pickMimeType() {
  const candidates = ['audio/webm', 'audio/ogg', 'audio/mp4'];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

async function startRecording() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    addError('Microphone access was blocked or unavailable. Check your browser\'s site permissions and try again.');
    return;
  }

  const mimeType = pickMimeType();
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  chunks = [];

  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    handleRecordingComplete(new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
  };

  mediaRecorder.start();
  setState('recording');
  setStatus('Listening\u2026 tap again to stop');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

async function handleRecordingComplete(blob) {
  setState('thinking');
  setStatus('Thinking\u2026');

  const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
  const form = new FormData();
  form.append('audio', blob, `recording.${ext}`);

  let res, data;
  try {
    res = await fetch(apiUrl('/chat'), { method: 'POST', body: form });
    data = await res.json();
  } catch (e) {
    addError('Could not reach the server. Check the server address in settings below, and that the service is running.');
    setState('idle');
    setStatus('Tap to talk');
    return;
  }

  if (!res.ok) {
    addError(data.detail || 'Something went wrong understanding that recording. Try again.');
    setState('idle');
    setStatus('Tap to talk');
    return;
  }

  setAccent(data.emotion);
  addBubble(data.text || data.transcript, data.emotion, data.reply);

  if (data.audio_url) {
    setState('speaking');
    setStatus('Speaking\u2026');
    const audio = new Audio(apiUrl(data.audio_url));
    audio.onended = () => { setState('idle'); setStatus('Tap to talk'); };
    audio.onerror = () => { setState('idle'); setStatus('Tap to talk'); };
    audio.play().catch(() => { setState('idle'); setStatus('Tap to talk'); });
  } else {
    if (data.audio_error) addError('Reply audio could not be generated, but here\'s the text.');
    setState('idle');
    setStatus('Tap to talk');
  }
}

orb.addEventListener('click', () => {
  if (state === 'idle') startRecording();
  else if (state === 'recording') stopRecording();
});
</script>
</body>
</html>
